<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>MedHub</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/assets/images/splash.png" as="image" />
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html {
            font-size: 16px !important;
            -webkit-text-size-adjust: 100% !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            font-size: 1rem !important;
            line-height: 1.5 !important;
            background: #0a0e1a;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .splash-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 60px;
            background-image: url('/assets/images/splash.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }
        .splash-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }
        .referral-badge {
            display: none;
            position: relative;
            z-index: 1;
            margin-bottom: 1.2rem;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(37,99,235,0.4);
            border-radius: 30px;
            padding: 0.5rem 1.5rem;
            font-size: 0.85rem;
            color: #60a5fa;
            letter-spacing: 0.5px;
            animation: badgePulse 2s ease-in-out infinite;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .referral-badge span { font-weight: 600; color: #fff; }
        @keyframes badgePulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }
        .loading-section {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
            max-width: 280px;
            margin-bottom: 1.5rem;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #60a5fa, #2563eb);
            background-size: 200% 100%;
            border-radius: 2px;
            animation: progressShimmer 1.5s linear infinite;
            transition: width 0.3s ease;
        }
        @keyframes progressShimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }
        .loading-text {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .loading-text .dot {
            display: inline-block;
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .loading-text .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-text .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }
        .version-info {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            font-weight: 300;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            margin-top: 0.25rem;
        }
        @media (max-width: 480px) {
            .splash-container { padding-bottom: 40px; }
            .loading-section { max-width: 220px; }
            .spinner { width: 28px; height: 28px; }
        }
        @media (min-width: 768px) {
            .splash-container { padding-bottom: 80px; }
            .loading-section { max-width: 320px; }
        }
    </style>
</head>
<body>
    <div class="splash-container" id="splashContainer">
        <div class="referral-badge" id="referralBadge">
            🎯 Referral: <span id="refBadgeCode">—</span>
        </div>

        <div class="loading-section" id="loadingSection">
            <div class="spinner" id="spinner"></div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="loading-text" id="loadingText">
                Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </div>
        </div>

        <div class="version-info">v1.0.0</div>
    </div>

    <script type="module">
        // ===================================================================
        // 1. IMPORTS
        // ===================================================================
        import { App } from '@capacitor/app';

        // ===================================================================
        // 2. DOM REFS
        // ===================================================================
        const progressFill = document.getElementById('progressFill');
        const loadingText = document.getElementById('loadingText');
        const spinner = document.getElementById('spinner');
        const referralBadge = document.getElementById('referralBadge');
        const refBadgeCode = document.getElementById('refBadgeCode');

        // ===================================================================
        // 3. STATE
        // ===================================================================
        let pendingAppUrl = null;
        let appInitialized = false;
        let appAuthenticated = false;
        let referralCode = null;

        // ===================================================================
        // 4. DEEP-LINK NORMALISER
        // ===================================================================
        function normalizeMedHubUrl(url) {
            try {
                const parsed = new URL(url);
                // Accept only our official domain over HTTPS
                if (parsed.protocol !== 'https:' || parsed.hostname !== 'medhub.edgeone.app') {
                    console.warn('[DeepLink] Rejected external URL:', url);
                    return null;
                }
                // Return pathname + search + hash (never hard-coded)
                return parsed.pathname + parsed.search + parsed.hash;
            } catch (error) {
                console.error('[DeepLink] Invalid URL:', url, error);
                return null;
            }
        }

        function isRootDestination(destination) {
            try {
                const parsed = new URL(destination, 'https://medhub.edgeone.app');
                return parsed.pathname === '/' || parsed.pathname === '/index.html';
            } catch {
                return false;
            }
        }

        // ===================================================================
        // 5. REFERRAL DETECTION (from URL or localStorage)
        // ===================================================================
        function detectReferral(sourceUrl = null) {
            let params;
            if (sourceUrl) {
                try {
                    const parsed = new URL(sourceUrl, 'https://medhub.edgeone.app');
                    params = parsed.searchParams;
                } catch {
                    params = new URLSearchParams(window.location.search);
                }
            } else {
                params = new URLSearchParams(window.location.search);
            }

            let code = params.get('ref') || params.get('referral') || params.get('code');
            if (code) {
                code = code.trim();
                if (code.length > 0) {
                    localStorage.setItem('referral_code', code);
                    console.log('[Splash] Referral code from URL:', code);
                    return code;
                }
            }
            const stored = localStorage.getItem('referral_code');
            if (stored) {
                console.log('[Splash] Referral code from storage:', stored);
                return stored;
            }
            return null;
        }

        // ===================================================================
        // 6. CAPACITOR APP PLUGIN – capture launch & open events
        // ===================================================================
        async function captureLaunchUrl() {
            try {
                const result = await App.getLaunchUrl();
                if (result?.url) {
                    console.log('[DeepLink] Launch URL:', result.url);
                    const normalized = normalizeMedHubUrl(result.url);
                    if (normalized) {
                        pendingAppUrl = normalized;
                        console.log('[DeepLink] Pending destination:', pendingAppUrl);
                    }
                }
            } catch (error) {
                console.warn('[DeepLink] Could not obtain launch URL:', error);
            }
        }

        function registerAppUrlListener() {
            App.addListener('appUrlOpen', ({ url }) => {
                console.log('[DeepLink] App URL opened:', url);
                const destination = normalizeMedHubUrl(url);
                if (!destination) return;

                if (appInitialized) {
                    processDestination(destination);
                } else {
                    pendingAppUrl = destination;
                }
            });
        }

        // ===================================================================
        // 7. DESTINATION PROCESSOR (generic)
        // ===================================================================
        function processDestination(destination) {
            if (!destination) return;

            // Root path → treat as referral only, no deep‑link routing
            if (isRootDestination(destination)) {
                console.log('[DeepLink] Root destination – handled by referral logic.');
                // The referral code was already extracted from the incoming URL
                // by detectReferral, so nothing else needed.
                return;
            }

            console.log('[DeepLink] Processing destination:', destination);

            if (appAuthenticated) {
                console.log('[DeepLink] Authenticated → navigating to:', destination);
                safeRedirect(destination);
            } else {
                console.log('[DeepLink] Authentication required – storing for later.');
                sessionStorage.setItem('redirectAfterLogin', destination);
                safeRedirect('/pages/welcome.html');
            }
        }

        // ===================================================================
        // 8. ORIENTATION LOCK
        // ===================================================================
        let screenOrientation = null;

        async function initOrientation() {
            try {
                const module = await import('@capacitor/screen-orientation');
                screenOrientation = module.ScreenOrientation;
                await screenOrientation.lock({ orientation: 'portrait' });
                console.log('[Splash] Orientation locked to portrait');
            } catch (e) {
                console.warn('[Splash] Orientation lock not available:', e);
            }
        }
        initOrientation();

        // ===================================================================
        // 9. SAFE REDIRECT (unlock + referral append)
        // ===================================================================
        function safeRedirect(targetPath) {
            if (screenOrientation) {
                screenOrientation.unlock().catch(() => {});
            }
            let target = targetPath;
            // Append referral code only if not already present
            if (referralCode && !target.includes('ref=')) {
                const sep = target.includes('?') ? '&' : '?';
                target += sep + 'ref=' + encodeURIComponent(referralCode);
            }
            console.log('[Splash] Redirecting to:', target);
            window.location.href = target;
        }

        // ===================================================================
        // 10. PROGRESS UPDATER
        // ===================================================================
        let progress = 0;
        const MIN_PROGRESS = 10;
        const MAX_PROGRESS = 100;

        function updateProgress(value, text) {
            progress = Math.min(value, MAX_PROGRESS);
            progressFill.style.width = progress + '%';
            if (text) loadingText.textContent = text;
            if (progress >= MAX_PROGRESS) {
                spinner.style.display = 'none';
                loadingText.textContent = '✓ Ready!';
            }
        }

        // ===================================================================
        // 11. LOADING ANIMATION (simulated)
        // ===================================================================
        let loadInterval = setInterval(() => {
            const step = 1 + Math.random() * 2;
            let current = parseFloat(progressFill.style.width) || MIN_PROGRESS;
            current += step;
            if (current > 85) current = 85;
            updateProgress(current);
            if (current >= 85) clearInterval(loadInterval);
        }, 120);

        // ===================================================================
        // 12. MAIN LOADER (with unified deep‑link handling)
        // ===================================================================
        async function loadApp() {
            try {
                // ---- (A) Capture Android launch URL BEFORE loading anything else ----
                await captureLaunchUrl();
                registerAppUrlListener();

                // ---- (B) Initial referral detection from the *launch* URL if present ----
                let initialReferral = null;
                if (pendingAppUrl) {
                    // Build a full URL to extract query params
                    const fullUrl = 'https://medhub.edgeone.app' + pendingAppUrl;
                    initialReferral = detectReferral(fullUrl);
                } else {
                    initialReferral = detectReferral(); // fallback to window.location
                }
                // Store globally
                referralCode = initialReferral;

                // Show referral badge if we have one
                if (referralCode) {
                    referralBadge.style.display = 'block';
                    refBadgeCode.textContent = referralCode;
                }

                // ---- (C) Load modules ----
                updateProgress(15, 'Loading core...');
                await import('/scripts/utils.js');
                updateProgress(30, 'Loading database...');
                await import('/scripts/db.js');
                updateProgress(45, 'Loading auth...');
                const auth = await import('/scripts/auth.js');
                updateProgress(55, 'Loading app...');
                const app = await import('/scripts/app.js');

                // ---- (D) Initialize app and check auth ----
                updateProgress(65, 'Initializing...');
                let isLoggedIn = false;
                try {
                    await app.initializeApp();
                    isLoggedIn = app.checkAuth ? app.checkAuth() : false;
                } catch (initErr) {
                    console.warn('[Splash] Init error, defaulting to welcome.', initErr);
                    isLoggedIn = false;
                }
                appAuthenticated = isLoggedIn;
                appInitialized = true;

                // ---- (E) Decide target ----
                let target;

                if (pendingAppUrl) {
                    // We have a deep link from Android
                    const destination = pendingAppUrl;
                    console.log('[Splash] Incoming URL:', destination);

                    if (isRootDestination(destination)) {
                        // Root URL → referral only; use standard auth flow
                        target = isLoggedIn ? '/pages/subjects.html' : '/pages/welcome.html';
                    } else {
                        // Any other path → treat as a page deep link
                        if (isLoggedIn) {
                            target = destination; // go directly
                        } else {
                            // Not logged in – store destination for after login
                            sessionStorage.setItem('redirectAfterLogin', destination);
                            target = '/pages/welcome.html';
                        }
                    }
                } else {
                    // No deep link → standard launch
                    target = isLoggedIn ? '/pages/subjects.html' : '/pages/welcome.html';
                }

                // ---- (F) Finish and redirect ----
                updateProgress(90, isLoggedIn ? 'Welcome back!' : 'Preparing...');
                clearInterval(loadInterval);
                updateProgress(100, 'Ready!');

                setTimeout(() => safeRedirect(target), 400);

            } catch (err) {
                console.error('[Splash] Load failed, redirecting to welcome:', err);
                clearInterval(loadInterval);
                loadingText.style.color = 'rgba(255,255,255,0.5)';
                loadingText.textContent = 'Continuing...';
                setTimeout(() => safeRedirect('/pages/welcome.html'), 600);
            }
        }

        // ===================================================================
        // 13. START
        // ===================================================================
        setTimeout(loadApp, 300);

        // ===================================================================
        // 14. SAFETY TIMEOUT
        // ===================================================================
        setTimeout(() => {
            if (progress < 95) {
                console.warn('[Splash] Timed out, redirecting to welcome.');
                clearInterval(loadInterval);
                safeRedirect('/pages/welcome.html');
            }
        }, 10000);

        // ===================================================================
        // 15. OFFLINE / ONLINE (informational only)
        // ===================================================================
        window.addEventListener('offline', () => {
            loadingText.textContent = 'Offline mode...';
        });
        window.addEventListener('online', () => {
            loadingText.textContent = 'Online, loading...';
        });
    </script>
</body>
</html>
