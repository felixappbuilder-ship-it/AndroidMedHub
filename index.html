<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>MedHub</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preload" href="/assets/images/splash.png" as="image" />

    <style>
        /* ===== RESET & BASE (unchanged) ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e1a;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .splash-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 60px;
            background-image: url('/assets/images/splash.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }
        .splash-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }
        .referral-badge {
            display: none;
            position: relative;
            z-index: 1;
            margin-bottom: 1.2rem;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(37,99,235,0.4);
            border-radius: 30px;
            padding: 0.5rem 1.5rem;
            font-size: 0.85rem;
            color: #60a5fa;
            letter-spacing: 0.5px;
            animation: badgePulse 2s ease-in-out infinite;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .referral-badge span { font-weight: 600; color: #fff; }
        @keyframes badgePulse {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
        }
        .loading-section {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            width: 100%;
            max-width: 280px;
            margin-bottom: 1.5rem;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #60a5fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .progress-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #60a5fa, #2563eb);
            background-size: 200% 100%;
            border-radius: 2px;
            animation: progressShimmer 1.5s linear infinite;
            transition: width 0.3s ease;
        }
        @keyframes progressShimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 200% 0%; }
        }
        .loading-text {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .loading-text .dot {
            display: inline-block;
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .loading-text .dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-text .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
            30% { opacity: 1; transform: translateY(-4px); }
        }
        .version-info {
            position: relative;
            z-index: 1;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1px;
            font-weight: 300;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
            margin-top: 0.25rem;
        }
        @media (max-width: 480px) {
            .splash-container { padding-bottom: 40px; }
            .loading-section { max-width: 220px; }
            .spinner { width: 28px; height: 28px; }
        }
        @media (min-width: 768px) {
            .splash-container { padding-bottom: 80px; }
            .loading-section { max-width: 320px; }
        }
    </style>
</head>
<body>
    <div class="splash-container" id="splashContainer">
        <div class="referral-badge" id="referralBadge">
            🎯 Referral: <span id="refBadgeCode">—</span>
        </div>

        <div class="loading-section" id="loadingSection">
            <div class="spinner" id="spinner"></div>
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="loading-text" id="loadingText">
                Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
            </div>
        </div>

        <div class="version-info">v1.0.0</div>
    </div>

    <script>
        (function() {
            'use strict';

            // DOM refs
            const progressFill = document.getElementById('progressFill');
            const loadingText = document.getElementById('loadingText');
            const spinner = document.getElementById('spinner');
            const referralBadge = document.getElementById('referralBadge');
            const refBadgeCode = document.getElementById('refBadgeCode');

            // ===== REFERRAL DETECTION =====
            function detectReferral() {
                const params = new URLSearchParams(window.location.search);
                let code = params.get('ref') || params.get('referral') || params.get('code');
                if (code) {
                    code = code.trim();
                    if (code.length > 0) {
                        localStorage.setItem('referral_code', code);
                        console.log('[Splash] Referral code from URL:', code);
                        return code;
                    }
                }
                const stored = localStorage.getItem('referral_code');
                if (stored) {
                    console.log('[Splash] Referral code from storage:', stored);
                    return stored;
                }
                return null;
            }

            const referralCode = detectReferral();
            if (referralCode) {
                referralBadge.style.display = 'block';
                refBadgeCode.textContent = referralCode;
            }

            // ===== PROGRESS UPDATER =====
            let progress = 0;
            const MIN_PROGRESS = 10;
            const MAX_PROGRESS = 100;

            function updateProgress(value, text) {
                progress = Math.min(value, MAX_PROGRESS);
                progressFill.style.width = progress + '%';
                if (text) loadingText.textContent = text;
                if (progress >= MAX_PROGRESS) {
                    spinner.style.display = 'none';
                    loadingText.textContent = '✓ Ready!';
                }
            }

            // ===== SIMULATE LOADING ANIMATION =====
            let loadInterval = setInterval(() => {
                const step = 1 + Math.random() * 2;
                let current = parseFloat(progressFill.style.width) || MIN_PROGRESS;
                current += step;
                if (current > 85) current = 85; // keep below 85 until real load finishes
                updateProgress(current);
                if (current >= 85) clearInterval(loadInterval);
            }, 120);

            // ===== LOAD APP MODULES & CHECK AUTH =====
            async function loadApp() {
                try {
                    updateProgress(15, 'Loading core modules...');

                    // Dynamic imports – these will be cached by the browser
                    const utils = await import('/scripts/utils.js');
                    updateProgress(30, 'Loading database...');

                    const db = await import('/scripts/db.js');
                    updateProgress(45, 'Loading authentication...');

                    const auth = await import('/scripts/auth.js');
                    updateProgress(55, 'Loading app state...');

                    const app = await import('/scripts/app.js');
                    updateProgress(65, 'Initializing app...');

                    // Initialize app (this loads user from IndexedDB)
                    await app.initializeApp();
                    updateProgress(80, 'Checking authentication...');

                    // Determine redirect
                    const isLoggedIn = app.checkAuth();
                    updateProgress(90, isLoggedIn ? 'Welcome back!' : 'Preparing welcome...');

                    // Build redirect URL with referral
                    let target = isLoggedIn ? '/pages/subjects.html' : '/pages/welcome.html';
                    if (referralCode) {
                        const sep = target.includes('?') ? '&' : '?';
                        target += sep + 'ref=' + encodeURIComponent(referralCode);
                    }

                    // Clear loading interval and finalise
                    clearInterval(loadInterval);
                    updateProgress(100, 'Ready!');

                    // Short delay so the user sees the "Ready!" state
                    setTimeout(() => {
                        console.log('[Splash] Redirecting to:', target);
                        window.location.href = target;
                    }, 500);

                } catch (err) {
                    console.error('[Splash] Failed to load app:', err);
                    loadingText.textContent = '⚠️ Error loading app. Please check your connection.';
                    loadingText.style.color = '#f87171';
                    spinner.style.display = 'none';
                    // Allow retry after a delay?
                    setTimeout(() => {
                        if (confirm('Failed to load the app. Retry?')) {
                            window.location.reload();
                        } else {
                            // Fallback to welcome
                            window.location.href = '/pages/welcome.html' + (referralCode ? '?ref=' + referralCode : '');
                        }
                    }, 2000);
                }
            }

            // ===== START LOADING =====
            // Wait a moment for the splash to be visible, then start loading
            setTimeout(loadApp, 400);

            // ===== OFFLINE / ONLINE HANDLING =====
            window.addEventListener('offline', () => {
                loadingText.textContent = 'You are offline. Using cached resources.';
                loadingText.style.color = 'rgba(255,255,255,0.7)';
            });
            window.addEventListener('online', () => {
                loadingText.textContent = 'Back online. Syncing...';
                loadingText.style.color = 'rgba(255,255,255,0.7)';
                setTimeout(() => {
                    loadingText.textContent = 'Loading...';
                    loadingText.style.color = '';
                }, 1500);
            });

            // ===== SAFETY TIMEOUT (if everything fails) =====
            setTimeout(() => {
                if (progress < 95) {
                    console.warn('[Splash] Loading timed out, redirecting to welcome.');
                    clearInterval(loadInterval);
                    window.location.href = '/pages/welcome.html' + (referralCode ? '?ref=' + referralCode : '');
                }
            }, 12000);

        })();
    </script>
</body>
</html>
